apiVersion: v1
kind: Namespace
metadata:
  name: start
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: start
  namespace: start
spec:
  replicas: 1
  selector:
    matchLabels:
      app: start
  template:
    metadata:
      labels:
        app: start
    spec:
      containers:
        - name: start
          image: __IMAGE__
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: start
  namespace: start
spec:
  type: NodePort
  selector:
    app: start
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080
